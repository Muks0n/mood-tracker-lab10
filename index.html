
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Трекер настрою</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header class="site-header">
        <h1>Трекер настрою</h1>

        <nav>
            <a href="#mood-tracker">Відмітити настрій</a>
            <a href="#history">Історія записів</a>
        </nav>
    </header>

    <div class="page-layout">
        <main>
            <section id="mood-tracker">
                <h2>Відмітити настрій</h2>

                <form id="mood-form">
                    <label for="date">Дата:</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                    <label for="mood">Рівень настрою (1–5):</label>
                    <input
                        type="number"
                        id="mood"
                        name="mood"
                        min="1"
                        max="5"
                        step="1"
                        required
                    >

                    <label for="note">Примітка:</label>
                    <input
                        type="text"
                        id="note"
                        name="note"
                        maxlength="200"
                    >

                    <p id="note-counter">
                        Залишилося символів: 200
                    </p>

                    <button type="submit">Зберегти</button>
                </form>
            </section>

            <section id="history">
                <h2>Історія записів</h2>

                <div class="cards" id="mood-history">
                    <article class="mood-card">
                        <h3>Дата: 2026-08-09</h3>
                        <p>Настрій: Задовільний</p>
                    </article>
                </div>
            </section>
        </main>

        <aside>
            <h2>Короткий підсумок</h2>

            <p id="avg-mood">
                Середній настрій: ще не обчислено
            </p>
        </aside>
    </div>

    <footer>
        <p>
            Трекер настрою - Вебзастосунок для
            відстеження настрою та емоцій користувача.
            &copy; 2026
        </p>
    </footer>
</body>
</html>
