
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Трекер настрою</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/app.js" defer></script>
</head>

<body>
    <header class="site-header">
        <h1>Трекер настрою</h1>

        <nav>
            <a href="#mood-tracker">Відмітити настрій</a>
            <a href="#history">Історія записів</a>
        </nav>
    </header>

    <div class="page-layout">
        <main>
            <section id="mood-tracker">
                <h2>Відмітити настрій</h2>

                <form>
                    <label for="mood">
                        Напишіть який у вас настрій:
                    </label>

                    <input type="text" id="mood" name="mood">

                    <button type="submit">Зберегти</button>
                </form>
            </section>

            <section id="history">
                <h2>Історія записів</h2>

                <div class="cards" id="mood-history">

                    <!-- JavaScript видалить її через remove() -->
                    <article class="mood-card">
                        <h3>Дата: 2026-08-09</h3>
                        <p>Настрій: Задовільний</p>
                    </article>

                </div>
            </section>
        </main>

        <aside>
            <h2>Короткий підсумок</h2>

            <!-- ЗМІНА 4: Додано id="avg-mood" -->
            <p id="avg-mood">
                Середній настрій: ще не обчислено
            </p>
        </aside>
    </div>

    <footer>
        <p>
            Трекер настрою - Вебзастосунок для
            відстеження настрою та емоцій користувача.
            &copy; 2026
        </p>
    </footer>
</body>
</html>
